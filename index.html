.usd2{font-size:13px;color:var(--tx3);font-weight:500;margin-top:1px}

<script>

function V8_dayNum(iso) { var p = String(iso).slice(0, 10).split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function V8_isoDay(n) { var d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
function V8_addDays(iso, n) { return V8_isoDay(V8_dayNum(iso) + n); }
/* money-weighted return. cfs: [{date, amount}] with money you put in negative. Returns a fraction a year, or null. */
function V8_xirr(cfs) {
  if (!cfs.length) return null;
  var list = cfs.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }), t0 = V8_dayNum(list[0].date);
  var npv = function (r) { var s = 0; for (var i = 0; i < list.length; i++) s += list[i].amount / Math.pow(1 + r, (V8_dayNum(list[i].date) - t0) / 365); return s; };
  var lo = -0.99, hi = 50, flo = npv(lo), fhi = npv(hi);
  if (flo * fhi > 0) return null;
  for (var k = 0; k < 200; k++) { var mid = (lo + hi) / 2, fm = npv(mid); if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; } if (hi - lo < 1e-10) break; }
  return (lo + hi) / 2;
}

function monthsFrom(startIso, n) { var y = +startIso.slice(0, 4), m = +startIso.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + ('0' + (m + 1)).slice(-2) + '-' + startIso.slice(8, 10); }

/* ---------- filters for the reporting screens: Transactions, Income and Reports ----------
   Several values per group (for example brokers IBKR and Wio), a date range, and the same choice follows you between these three screens. */
var TF = {}, TFR = { from: '', to: '' }, TFX = { kind: '', rows: null, redraw: '', date: '', vals: [], dim: '' };
var TFDIMS = { transactions: [['broker', 'Broker'], ['account', 'Account'], ['region', 'Region'], ['type', 'Type']], income: [['broker', 'Broker'], ['account', 'Account'], ['region', 'Region']],
  closed: [['broker', 'Broker'], ['account', 'Account'], ['region', 'Region'], ['sector', 'Sector']], holdings: [['broker', 'Broker'], ['account', 'Account'], ['region', 'Region'], ['sector', 'Sector']] };
var TFDATE = { transactions: 'date', income: 'date', closed: 'lastSell', holdings: '' };
function tfN() { var n = 0; for (var k in TF) n += TF[k].length; return n; }
function tfAny() { return tfN() || TFR.from || TFR.to; }
function tfPass(r, dateKey) {
  for (var k in TF) { if (TF[k].length && TF[k].indexOf((r.dims || {})[k] || '') < 0) return false; }
  var d = dateKey ? r[dateKey] : null; if (d) { d = String(d).slice(0, 10); if (TFR.from && d < TFR.from) return false; if (TFR.to && d > TFR.to) return false; }
  return true;
}
function tfBar(kind, rowsFn, redraw) {
  TFX = { kind: kind, rows: rowsFn, redraw: redraw, date: TFDATE[kind] || '', vals: [], dim: '' };
  var pills = [], dn = {}; TFDIMS[kind].forEach(function (d) { dn[d[0]] = d[1]; });
  Object.keys(TF).forEach(function (k) { if (dn[k]) TF[k].forEach(function (v, i) { pills.push('<button class="chip on" onclick="tfDrop(\'' + k + '\',' + i + ')">' + esc(v || '(none)') + ' ✕</button>'); }); });
  var h = '<div class="chips"><button class="chip ' + (tfN() ? 'on' : '') + '" onclick="tfSheet()">⚲ Filter' + (tfN() ? ' · ' + tfN() : '') + '</button>' + pills.join('') + (tfAny() ? '<button class="chip" onclick="tfClear()">Clear</button>' : '') + '</div>';
  if (TFX.date) h += '<div class="frow"><span class="tiny">From</span><input type="date" class="sel" value="' + TFR.from + '" onchange="TFR.from=this.value;tfApply()"><span class="tiny">to</span><input type="date" class="sel" value="' + TFR.to + '" onchange="TFR.to=this.value;tfApply()">'
    + '<button class="chip" onclick="tfPreset(\'ytd\')">This year</button><button class="chip" onclick="tfPreset(\'ly\')">Last year</button><button class="chip" onclick="tfPreset(\'90\')">90 days</button><button class="chip" onclick="tfPreset(\'all\')">All</button></div>';
  return h;
}
function tfApply() { closeSheet(); if (typeof window[TFX.redraw] === 'function') window[TFX.redraw](); }
function tfClear() { TF = {}; TFR = { from: '', to: '' }; tfApply(); }
function tfPreset(p) { var t = new Date(); if (p === 'ytd') TFR = { from: isoD(new Date(t.getFullYear(), 0, 1)), to: isoD(t) }; else if (p === 'ly') TFR = { from: isoD(new Date(t.getFullYear() - 1, 0, 1)), to: isoD(new Date(t.getFullYear() - 1, 11, 31)) }; else if (p === '90') TFR = { from: isoD(new Date(t.getTime() - 90 * 86400000)), to: isoD(t) }; else TFR = { from: '', to: '' }; tfApply(); }
function tfDrop(k, i) { if (TF[k]) { TF[k].splice(i, 1); if (!TF[k].length) delete TF[k]; } tfApply(); }
function tfSheet(dim) {
  var dims = TFDIMS[TFX.kind], rows = (TFX.rows && TFX.rows()) || []; dim = dim || TFX.dim || dims[0][0]; TFX.dim = dim;
  var cnt = {}; rows.forEach(function (r) { var v = (r.dims || {})[dim] || ''; cnt[v] = (cnt[v] || 0) + 1; });
  TFX.vals = Object.keys(cnt).sort(function (a, b) { return cnt[b] - cnt[a]; });
  var h = '<h2>Filter</h2><p class="mut sm">Choose several values in a group. Entries must match every group you use.</p><div class="chips" style="flex-wrap:wrap">' + dims.map(function (d) { return '<button class="chip ' + (dim === d[0] ? 'on' : '') + '" onclick="tfSheet(\'' + d[0] + '\')">' + d[1] + (TF[d[0]] && TF[d[0]].length ? ' · ' + TF[d[0]].length : '') + '</button>'; }).join('') + '</div><div style="margin-top:8px">';
  h += TFX.vals.map(function (v, i) { var on = (TF[dim] || []).indexOf(v) >= 0; return '<div class="row tap" onclick="tfTick(' + i + ')"><div class="grow"><div class="t">' + esc(v || '(none)') + '</div></div><span class="tiny">' + cnt[v] + '</span><span class="ck ' + (on ? 'on' : '') + '">' + (on ? '✓' : '') + '</span></div>'; }).join('') + '</div>';

function tfTick(i) { var dim = TFX.dim, v = TFX.vals[i], a = TF[dim] = TF[dim] || [], k = a.indexOf(v); if (k >= 0) a.splice(k, 1); else a.push(v); if (!a.length) delete TF[dim]; tfSheet(dim); }
/* the filter card on the Reports screen: it loads the rows of the chosen report so the choices show real counts */

/* ---------- Home charts: trajectory to goal, what drove your gains, drawdown ---------- */
var TRJ = { view: 'value' }, DDN = { range: 'ALL' }, CTB = { period: '1Y', dim: 'region', metric: 'gain', data: {}, busy: false, err: '' };
function addMonthsIso(iso, n) { var y = +iso.slice(0, 4), m = +iso.slice(5, 7) - 1 + n, d = +iso.slice(8, 10); y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + ('0' + (m + 1)).slice(-2) + '-' + ('0' + Math.min(d, 28)).slice(-2); }
function lastAtOrBefore(pts, d) { var best = null; for (var i = 0; i < pts.length; i++) { if (pts[i][0] <= d) best = pts[i]; else break; } return best; }
function homeCharts(o) {
  var j = o.journey; if (!j || !j.planSeries || !j.planSeries.length) return '';
  return trajCard(o, j) + ctbCard() + ddCard(o);
}
function trajCard(o, j) {
  var plan = j.planSeries, series = o.series || [], asOf = o.asOf, val = o.valueUsd, goalDate = j.targetDate, rate = (j.rateUsedPct !== null && j.rateUsedPct !== undefined ? j.rateUsedPct : j.targetCagr) / 100, monthly = j.monthlyPlan || 0;
  var h = '<div class="card"><h3>Trajectory to ' + usd(j.goal) + '</h3><div class="seg" style="margin-bottom:8px"><button class="' + (TRJ.view === 'value' ? 'on' : '') + '" onclick="TRJ.view=\'value\';drawHome(S.ov)">Value</button><button class="' + (TRJ.view === 'dep' ? 'on' : '') + '" onclick="TRJ.view=\'dep\';drawHome(S.ov)">Money put in</button></div>';
  if (TRJ.view === 'value') {
    var planPts = plan.map(function (p) { return [p.d, p.v]; }), act = series.filter(function (r, i) { return i % 4 === 0 || i === series.length - 1; }).map(function (r) { return [r[0], r[1]]; });
    var proj = [[asOf, val]], pv = val, dd = asOf, mr = Math.pow(1 + rate, 1 / 12), tr = Math.pow(1 + j.targetCagr / 100, 1 / 12), proj2 = [[asOf, val]], pv2 = val;
    for (var k = 0; k < 400; k++) { dd = addMonthsIso(dd, 1); if (dd > goalDate) break; pv = (pv + monthly) * mr; pv2 = (pv2 + monthly) * tr; proj.push([dd, pv]); proj2.push([dd, pv2]); }
    var lines = [{ pts: planPts, color: '#C9A227', w: 1.6, dash: true }, { pts: act, color: 'var(--acc)', w: 2, fill: true }, { pts: proj, color: '#4F8FE8', w: 1.8, dash: true }];
    var tip = function (d) { var pl = lastAtOrBefore(planPts, d), ac = d <= asOf ? lastAtOrBefore(act, d) : null, pj = d > asOf ? lastAtOrBefore(proj, d) : null; return dshort(d) + (pl ? ' · plan ' + usd(pl[1]) : '') + (ac ? ' · you ' + usd(ac[1]) : '') + (pj ? ' · projected ' + usd(pj[1]) : ''); };
    h += lineChart('ctraj', lines, { marks: [{ v: j.goal }], h: 190, tip: tip, xlabels: [plan[0].d, goalDate] });
    h += '<div class="legend"><span><i style="background:#C9A227"></i>Plan (' + j.targetCagr + '% a year)</span><span><i style="background:var(--acc)"></i>You</span><span><i style="background:#4F8FE8"></i>From today at ' + pcp(rate * 100, 1) + ' + ' + usd(monthly) + ' a month</span></div>';
    var gap = j.gapToPlan;
    h += '<div class="grid2" style="margin-top:10px"><div class="stat"><div class="k">Today vs plan</div><div class="v ' + (gap >= 0 ? 'pos' : 'neg') + '">' + (gap >= 0 ? usd(gap) + ' ahead' : usd(-gap) + ' behind') + '</div><div class="tiny">plan says ' + usd(j.planValueToday) + '</div></div><div class="stat"><div class="k">At ' + dshort(goalDate) + '</div><div class="v ' + (j.projectedAtCurrentRate >= j.goal ? 'pos' : 'neg') + '">' + usd(j.projectedAtCurrentRate) + '</div><div class="tiny">at your return so far · ' + usd(j.projectedAtTargetRate) + ' at ' + j.targetCagr + '%</div></div></div>';
  } else {
    var pl2 = plan.map(function (p) { return [p.d, p.c]; }), cum = 0, ix = {}; (o.flows || []).forEach(function (f) { if (f[2] !== 'INCOME_OUT') ix[f[0]] = (ix[f[0]] || 0) - f[1]; });
    var days = Object.keys(ix).sort(), dep = [[pl2[0][0], 0]]; days.forEach(function (d) { cum += ix[d]; dep.push([d, cum]); }); dep.push([asOf, cum]);
    var planTo = pl2.filter(function (p) { return p[0] <= asOf; });
    var lines2 = [{ pts: pl2, color: '#7A7886', w: 1.6, dash: true }, { pts: dep, color: 'var(--acc)', w: 2 }];
    var tip2 = function (d) { var a = lastAtOrBefore(pl2, d), b = d <= asOf ? lastAtOrBefore(dep, d) : null; return dshort(d) + (a ? ' · plan asked for ' + usd(a[1]) : '') + (b ? ' · you put in ' + usd(b[1]) : ''); };
    h += lineChart('ctraj', lines2, { h: 190, tip: tip2 });

  var yopts = d.years.map(function (y) { return '<option value="' + y.fy + '"' + (y.fy === TX.fy ? ' selected' : '') + '>' + esc(y.label) + '</option>'; }).join('');
  var F = function (id, lab) { return '<label class="field"><span>' + lab + '</span><input id="' + id + '" inputmode="decimal" placeholder="optional"></label>'; };
  h += '<div class="card"><h3>Check my return before I submit</h3><div class="tiny" style="margin-bottom:6px">Open the pre-filled statement of income on the tax portal and type the totals here. The app compares them with your ledger.</div><label class="field"><span>Financial year</span><select id="tcfy">' + yopts + '</select></label>'
    + F('tc_sale_value', 'Sale value of listed shares') + F('tc_st_gain', 'Short-term gain (shares)') + F('tc_lt_gain', 'Long-term gain (shares)') + F('tc_dividends', 'Dividends') + F('tc_debt_gain', 'Debt-fund gains (slab rate)') + F('tc_other_income', 'Other income on the return (interest etc.)') + F('tc_tds_total', 'Total TDS shown') + F('tc_tax_with_cess', 'Total tax with cess') + F('tc_interest_234', 'Interest 234B / 234C shown')
    + '<div class="btns"><button class="btn" id="tcb" onclick="txCheck()">Check</button></div><div id="tcres"></div></div>';
  /* loss register */
  var r = d.register;
  h += '<div class="card"><h3>Loss register</h3><div class="tiny">A short-term loss offsets short- and long-term gains. A long-term loss offsets long-term gains only. Carried forward up to 8 years, <b>only if the return was filed on time</b>.</div>';
  h += r.open.length ? r.open.map(function (e) { return '<div class="row"><div class="grow"><div class="t">' + (e.kind === 'ST' ? 'Short-term' : 'Long-term') + ' loss from ' + esc(e.label) + '</div><div class="s">' + inrS(e.leftInr) + ' left of ' + inrS(e.amountInr) + ' · usable until ' + esc(e.lastYear) + (e.lost ? ' · <span class="neg">filed late, cannot be carried</span>' : e.unconfirmed ? ' · mark that year as filed on time to be sure' : '') + '</div></div></div>'; }).join('') : '<div class="tiny" style="margin-top:6px">No loss is waiting to be used.</div>';
  h += '</div>';
  /* years */
  h += '<div class="card"><h3>Years and filing</h3>' + d.years.map(function (y) { return '<div class="row"><div class="grow"><div class="t">' + esc(y.label) + '</div><div class="s">short ' + inrS(y.stGainInr) + ' · long ' + inrS(y.ltGainInr) + ' · dividends ' + inrS(y.divInr) + ' · est. tax ' + inrS(y.taxInr) + '</div><div class="s">' + (y.filedOn ? 'filed ' + dshort(y.filedOn) + (y.onTime === false ? ' · <span class="neg">after the due date ' + dshort(y.due) + '</span>' : ' · on time') : 'not marked as filed · due ' + dshort(y.due)) + '</div></div>' + (can('review') ? '<button class="btn ghost sm" onclick="txFiledSheet(' + y.fy + ')">' + (y.filedOn ? 'Edit' : 'Mark filed') + '</button>' : '') + '</div>'; }).join('') + '</div>';
  /* brokers */
  h += '<div class="card"><h3>Does the broker withhold tax?</h3><div class="tiny">Today your brokers treat you as a resident and do not withhold tax on gains or dividends. Switch one on only after it starts to (for example after your NRI status is updated with it).</div>' + d.brokers.map(function (b) { return '<div class="row"><div class="grow"><div class="t">' + esc(b.broker) + '</div></div>' + (can('settings') ? '<button class="btn ' + (b.on ? '' : 'ghost') + ' sm" onclick="txTds(\'' + esc(b.broker) + '\',' + (b.on ? 'false' : 'true') + ')">' + (b.on ? 'Withholds' : 'Does not withhold') + '</button>' : '<span class="tiny">' + (b.on ? 'Withholds' : 'Does not withhold') + '</span>') + '</div>'; }).join('') + '</div>';
  /* export */
  h += '<div class="card"><h3>List of sales for your CA</h3><div class="tiny" style="margin-bottom:6px">One line per sale lot: dates, quantity, sale value, cost, gain and short or long term.</div><label class="field"><span>Financial year</span><select id="cgfy"><option value="">All years</option>' + d.years.map(function (y) { return '<option value="' + esc(y.label) + '">' + esc(y.label) + '</option>'; }).join('') + '</select></label><div class="btns"><button class="btn" id="cgb" onclick="txCsv()">Download CSV</button></div></div>';
  h += '<div class="note">' + esc(d.note) + ' Not covered here, so make sure your return has them: bank interest, other Indian income, foreign assets disclosure.</div>';
  $('#main').innerHTML = h;
}
function txNum(id) { var v = ($('#' + id) || {}).value; return v === undefined ? '' : String(v).trim(); }
function txCheck() {
  var b = $('#tcb'), P = { fy: $('#tcfy').value }; ['sale_value', 'st_gain', 'lt_gain', 'dividends', 'debt_gain', 'other_income', 'tds_total', 'tax_with_cess', 'interest_234'].forEach(function (k) { P[k] = txNum('tc_' + k); }); TX.fy = +P.fy;
  busy(b, true); api('taxcheck', P).then(function (r) {
    busy(b, false); TX.chk = r;
    $('#tcres').innerHTML = '<div style="margin-top:12px"><b>' + esc(r.label) + ': ' + (r.issues ? r.issues + ' to look at' : 'everything checked agrees') + '</b></div>' + r.findings.map(function (f) {
      return '<div class="row" style="align-items:flex-start"><div class="grow"><div class="t" style="white-space:normal">' + esc(f.title) + ' <span class="badge ' + (f.status === 'OK' ? 'OK' : f.status === 'CHECK' ? 'WARN' : '') + '">' + (f.status === 'OK' ? 'matches' : f.status === 'CHECK' ? 'check' : 'info') + '</span></div><div class="tiny" style="white-space:normal">Return ' + inrS(f.returnInr) + ' · App ' + inrS(f.appInr) + (f.diffInr ? ' · difference ' + inrS(f.diffInr) : '') + '</div><div class="tiny" style="margin-top:2px">' + esc(f.text) + '</div></div></div>';
    }).join('') + '<div class="tiny" style="margin-top:6px">' + esc(r.note) + '</div>';
  }).catch(function (e) { busy(b, false); toast(e.message); });
}
function txPaySheet() {
  var d = TX.d, t = new Date().toISOString().slice(0, 10);
  sheet('<h2>I paid tax</h2><p class="mut sm">Nothing is paid from here. Note the payment you made on the tax portal.</p><div class="seg"><button id="tpa" class="on" onclick="TX.kind=\'ADVANCE\';$(\'#tpa\').className=\'on\';$(\'#tps\').className=\'\'">Advance tax</button><button id="tps" onclick="TX.kind=\'SELF_ASSESSMENT\';$(\'#tps\').className=\'on\';$(\'#tpa\').className=\'\'">Self-assessment</button></div><label class="field"><span>Date paid</span><input type="date" id="tpd" value="' + t + '"></label><label class="field"><span>Amount (INR)</span><input id="tpm" inputmode="decimal"></label><label class="field"><span>Note (optional)</span><input id="tpn"></label><div class="btns"><button class="btn" id="tpb" onclick="txPaySave()">Save</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>');
  TX.kind = 'ADVANCE';
}
function txPaySave() {
  var b = $('#tpb'); busy(b, true);
  api('tax_payment_add', { date: $('#tpd').value, amount: $('#tpm').value, kind: TX.kind, note: $('#tpn').value, fy: TX.kind === 'ADVANCE' ? TX.d.curFy : '' }).then(function (r) { closeSheet(); planDone(r); SCREENS.taxfile(); }).catch(function (e) { toast(e.message); busy(b, false); });
}
function txFiledSheet(fy) {
  var y = TX.d.years.filter(function (x) { return x.fy === fy; })[0] || {};
  sheet('<h2>Return for ' + esc(y.label || fy) + '</h2><p class="mut sm">Due ' + dshort(y.due) + '. A loss can be carried forward only if you filed by then.</p><label class="field"><span>Date filed</span><input type="date" id="tfd" value="' + esc(y.filedOn || new Date().toISOString().slice(0, 10)) + '"></label><label class="field"><span>Tax on the return, INR (optional)</span><input id="tft" inputmode="decimal" value="' + (y.returnTaxInr === null || y.returnTaxInr === undefined ? '' : y.returnTaxInr) + '"></label><div class="btns"><button class="btn" id="tfb" onclick="txFiledSave(' + fy + ')">Save</button><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>');
}
function txFiledSave(fy) {
  var b = $('#tfb'); busy(b, true);
  api('tax_filed', { fy: fy, filed_on: $('#tfd').value, return_tax: $('#tft').value }).then(function (r) { closeSheet(); planDone(r); SCREENS.taxfile(); }).catch(function (e) { toast(e.message); busy(b, false); });
}
function txTds(broker, on) { api('tds_set', { broker: broker, on: on }).then(function (r) { planDone(r); SCREENS.taxfile(); }).catch(function (e) { toast(e.message); }); }
function txCsv() {
  var b = $('#cgb'), fy = $('#cgfy').value; busy(b, true);
  api('taxcg').then(function (d) {
    busy(b, false); var rows = d.rows.filter(function (r) { return !fy || r.fy === fy; });
    if (!rows.length) { toast('No sales in that year.'); return; }
    var head = ['Financial year', 'Sell date', 'Buy date', 'Asset', 'Name', 'Account', 'Broker', 'Quantity', 'Sale value INR', 'Cost INR', 'Selling charges INR', 'Gain INR (sale value less cost)', 'Term', 'Type', 'Origin', 'Reference'];
    var csv = [head].concat(rows.map(function (r) { return [r.fy, r.sellDate, r.buyDate, r.asset, r.name, r.acct, r.broker, r.qty, r.saleValue, r.cost, r.sellFees, r.gainAsFiled, r.term, r.cls, r.origin, r.ref]; })).map(function (r) { return r.map(function (c) { c = c === null || c === undefined ? '' : String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = 'capital_gains_' + (fy || 'all_years').replace(/[^\w-]+/g, '_') + '.csv'; document.body.appendChild(a); a.click(); a.remove(); toast('Downloaded ' + rows.length + ' lines');
  }).catch(function (e) { busy(b, false); toast(e.message); });
}

/* ---------- sale-time hint inside the Add transaction sheet ---------- */
var _txHintT = null;
function txHint() {
  clearTimeout(_txHintT);
  _txHintT = setTimeout(function () {
    var xs = $('#xs'), xa = $('#xa'); if (!xs || !xa || !isAll()) return;
    var host = $('#xh'); if (!host) { var g = $('#xg'); if (!g) return; g.insertAdjacentHTML('afterend', '<div id="xh"></div>'); host = $('#xh'); }
    if (S.txSide !== 'SELL' || !xs.value.trim() || !xa.value) { host.innerHTML = ''; return; }
    api('sale_hint', { acct: xa.value, asset: xs.value.trim().toUpperCase(), qty: $('#xq').value, price: $('#xp').value }).then(function (r) {
      var h2 = $('#xh'); if (!h2) return;
      h2.innerHTML = r && r.applies && r.shortQty > 0 ? '<div class="banner" style="margin:8px 0"><div class="sm"><b>Tax hint:</b> ' + esc(r.note) + '</div></div>' : '';
    }).catch(function () { var h3 = $('#xh'); if (h3) h3.innerHTML = ''; });
  }, 500);
}
document.addEventListener('input', function (e) { if (e.target && /^x[asqpd]$/.test(e.target.id || '')) txHint(); });
document.addEventListener('change', function (e) { if (e.target && /^x[asqpd]$/.test(e.target.id || '')) txHint(); });
document.addEventListener('click', function (e) { if (e.target && (e.target.id === 'tb' || e.target.id === 'ts')) txHint(); });

</script>
