<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Portfolio</title>
<meta name="theme-color" content="#0a0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0a0e13;--bg2:#10161d;--card:#151c25;--card2:#1b2430;--line:#243040;--tx:#eaf0f6;--tx2:#9aa8b8;--tx3:#6b7a8c;--acc:#35d0a0;--acc2:#1fa57f;--accbg:rgba(53,208,160,.12);--pos:#35d0a0;--neg:#ff6b6b;--warn:#f5b042;--info:#5aa9ff;--r:18px;--shadow:0 6px 24px rgba(0,0,0,.35);--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
:root[data-theme=light]{--bg:#f3f6f9;--bg2:#e9eef3;--card:#fff;--card2:#f4f7fa;--line:#dde4ec;--tx:#0f1a26;--tx2:#4f5f72;--tx3:#8190a3;--acc:#0e9f78;--acc2:#0b7e5f;--accbg:rgba(14,159,120,.1);--pos:#0e9f78;--neg:#d6403f;--warn:#c98410;--info:#2a74d4;--shadow:0 6px 20px rgba(20,40,70,.08)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f3f6f9;--bg2:#e9eef3;--card:#fff;--card2:#f4f7fa;--line:#dde4ec;--tx:#0f1a26;--tx2:#4f5f72;--tx3:#8190a3;--acc:#0e9f78;--acc2:#0b7e5f;--accbg:rgba(14,159,120,.1);--pos:#0e9f78;--neg:#d6403f;--warn:#c98410;--info:#2a74d4;--shadow:0 6px 20px rgba(20,40,70,.08)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#top{padding:calc(var(--sat) + 10px) 18px 6px;display:flex;align-items:center;gap:10px;min-height:calc(var(--sat) + 52px)}
#top h1{font-size:26px;letter-spacing:-.02em;margin:0;flex:1;font-weight:700}
#top .sub{font-size:12px;color:var(--tx3);display:block;font-weight:500;letter-spacing:0}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--tx);display:grid;place-items:center;position:relative}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:6px;right:7px;min-width:16px;height:16px;border-radius:8px;background:var(--neg);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px calc(90px + var(--sab))}
#ptr{height:0;overflow:hidden;text-align:center;color:var(--tx3);font-size:12px;transition:height .15s}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:8px 10px calc(8px + var(--sab));background:linear-gradient(to top,var(--bg) 60%,transparent);pointer-events:none}
#tabs .nav{pointer-events:auto;display:flex;width:100%;max-width:560px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:var(--shadow)}
#tabs button{flex:1;border:0;background:none;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;padding:6px 0;border-radius:20px;font-weight:600;position:relative}
#tabs button svg{width:22px;height:22px}
#tabs button.on{color:var(--acc);background:var(--accbg)}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 12px;border:1px solid var(--line)}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:700}
.hero{padding:22px 18px 18px;background:linear-gradient(160deg,var(--card2),var(--card));position:relative;overflow:hidden}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero .lbl{color:var(--tx3);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--tx2)}.sm{font-size:12px}.tiny{font-size:11px;color:var(--tx3)}
.num{font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04130d}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;color:var(--tx2);font-weight:600;font-size:13px}
.seg button.on{background:var(--card2);color:var(--tx);box-shadow:0 1px 0 var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:14px;padding:12px}
.stat .k{font-size:11px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:19px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-variant-numeric:tabular-nums}
.tap{cursor:pointer}.tap:active{opacity:.6}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--accbg);color:var(--acc);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--card2);color:var(--tx2);letter-spacing:.03em}
.badge.OK{background:var(--accbg);color:var(--pos)}.badge.MANUAL{background:rgba(90,169,255,.14);color:var(--info)}.badge.STALE,.badge.WARN,.badge.FAILING{background:rgba(245,176,66,.16);color:var(--warn)}.badge.ERROR,.badge.RED,.badge.BREACH{background:rgba(255,107,107,.16);color:var(--neg)}.badge.ESTIMATED{background:rgba(255,107,107,.1);color:var(--neg)}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.btn{border:0;background:var(--acc);color:#04130d;font-weight:700;border-radius:14px;padding:12px 16px;font-size:15px}
.btn.ghost{background:var(--card2);color:var(--tx)}.btn.danger{background:rgba(255,107,107,.16);color:var(--neg)}.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.field{display:block;margin:0 0 12px}.field span{display:block;font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}
.field input:focus,.field select:focus{border-color:var(--acc)}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:0 0 10px;outline:0}
#sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#sheetbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:var(--bg2);border-radius:24px 24px 0 0;max-height:90%;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;z-index:21;padding:8px 16px calc(24px + var(--sab));border:1px solid var(--line)}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
#sheet h2{margin:0 0 4px;font-size:20px}
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sab));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:all .2s;z-index:40;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.lock .logo{width:84px;height:84px;border-radius:24px;background:linear-gradient(145deg,#35d0a0,#1b7f9a);display:grid;place-items:center;margin-bottom:18px;box-shadow:0 10px 30px rgba(53,208,160,.3)}
.lock .logo svg{width:44px;height:44px;color:#04130d}
.lock h1{margin:0 0 6px}.lock p{color:var(--tx2);margin:0 0 20px;max-width:320px}
.lock .box{width:100%;max-width:340px}
.err{color:var(--neg);font-size:13px;min-height:18px;margin:8px 0}
.banner{display:flex;gap:10px;align-items:center;background:rgba(245,176,66,.12);border:1px solid rgba(245,176,66,.3);border-radius:14px;padding:12px;margin:0 0 12px}
.banner.red{background:rgba(255,107,107,.1);border-color:rgba(255,107,107,.3)}
.alert{border-left:4px solid var(--warn)}.alert.ERROR,.alert.RED{border-left-color:var(--neg)}.alert.INFO{border-left-color:var(--info)}
svg.chart{width:100%;display:block;touch-action:pan-y}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2);margin-top:4px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t th{text-align:left;color:var(--tx3);font-weight:600;font-size:11px;text-transform:uppercase;padding:6px 4px}table.t td{padding:8px 4px;border-top:1px solid var(--line)}table.t .r{text-align:right}
.hide{display:none!important}
.empty{text-align:center;color:var(--tx3);padding:30px 10px}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:middle}@keyframes sp{to{transform:rotate(360deg)}}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--card),var(--card2),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:12px}@keyframes sk{to{background-position:-200% 0}}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.kv:first-child{border-top:0}.kv span:first-child{color:var(--tx2)}
.note{font-size:12px;color:var(--tx3);margin:6px 2px 12px}
.reportdoc{display:none}
@media print{body{background:#fff;color:#000}#app,#sheet,#sheetbg,#tabs,#toast,.lock{display:none!important}.reportdoc{display:block!important;padding:12mm;color:#000;font:11pt/1.35 system-ui}.reportdoc h1{font-size:18pt}.reportdoc table{width:100%;border-collapse:collapse;font-size:9pt}.reportdoc th,.reportdoc td{border-bottom:1px solid #ccc;padding:3px 4px;text-align:left}.reportdoc .r{text-align:right}}
@media(min-width:900px){
 #app{max-width:none;margin:0 0 0 210px}
 #top{padding:24px 40px 8px;max-width:1180px}#top h1{font-size:30px}
 #main{padding:8px 40px 40px}#main>*{max-width:1180px;margin-left:auto;margin-right:auto}
 #main.cols{column-count:2;column-gap:16px;max-width:1180px}#main.cols>*{break-inside:avoid;max-width:none}#main.cols>.chips,#main.cols>.seg,#main.cols>.banner{column-span:all}
 #tabs{top:0;bottom:0;right:auto;width:210px;padding:24px 14px;background:var(--bg2);border-right:1px solid var(--line);justify-content:flex-start;align-items:flex-start}
 #tabs .nav{flex-direction:column;max-width:none;box-shadow:none;border:0;background:none;gap:4px;padding:0}
 #tabs button{flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;justify-content:flex-start;width:100%}
 #tabs button svg{width:20px;height:20px}#tabs .dot{position:static;margin-left:auto}
 #sheet{left:50%;right:auto;width:560px;max-width:92%;bottom:auto;top:50%;transform:translate(-50%,-40%);opacity:0;pointer-events:none;border-radius:24px;max-height:86%}
 #sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
 #toast{bottom:30px}.lock .box{max-width:380px}
 svg.chart{height:240px!important}
}

.usd2{font-size:11px;color:var(--tx3);font-weight:500;margin-top:1px}
.btn,.chip,.iconbtn,.seg button,#tabs button,.tap{transition:transform .08s ease,opacity .12s,background .15s}
.btn:active,.chip:active,.iconbtn:active,.seg button:active,#tabs button:active{transform:scale(.94);opacity:.8}
.tap:active{background:var(--card2);opacity:1}
.working{pointer-events:none;opacity:.75;position:relative}
.working::after{content:"";position:absolute;right:10px;top:50%;width:14px;height:14px;margin-top:-7px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
.btn.working,.chip.working{padding-right:32px}
#prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:pg 1s linear infinite;opacity:0;transition:opacity .15s}
#prog.on{opacity:1}@keyframes pg{from{background-position:-40% 0}to{background-position:140% 0}}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--info);background:rgba(90,169,255,.12);padding:3px 9px;border-radius:999px}
.pill i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--info);border-top-color:transparent;animation:sp 1.6s linear infinite}
.sorts{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;align-items:center}
.sorts::-webkit-scrollbar{display:none}

.livetag{font-size:9px;font-weight:700;color:var(--info);border:1px solid var(--info);border-radius:4px;padding:0 3px;margin-right:5px;opacity:.85;letter-spacing:.04em;text-transform:uppercase}
.press{transform:scale(.97)}
.btn,.chip,.row.tap,.iconbtn,#tabs button,.seg button{transition:transform .08s,opacity .08s}
.btn:active,.chip:active,.iconbtn:active,#tabs button:active,.seg button:active{transform:scale(.94);opacity:.8}
.row.tap:active{background:var(--card2)}

</style>

<div id="prog"></div><div id="app"><div id="top"></div><div id="ptr"></div><div id="main"></div></div>

<div id="sheetbg" onclick="closeSheet()"></div><div id="sheet"></div>
<div id="toast"></div>
<div id="lock" class="lock hide"></div>
<div id="reportdoc" class="reportdoc"></div>
<script>

function V8_dayNum(iso) { var p = String(iso).slice(0, 10).split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function V8_isoDay(n) { var d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
function V8_addDays(iso, n) { return V8_isoDay(V8_dayNum(iso) + n); }
/* money-weighted return. cfs: [{date, amount}] with money you put in negative. Returns a fraction a year, or null. */
function V8_xirr(cfs) {
  if (!cfs.length) return null;
  var list = cfs.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }), t0 = V8_dayNum(list[0].date);
  var npv = function (r) { var s = 0; for (var i = 0; i < list.length; i++) s += list[i].amount / Math.pow(1 + r, (V8_dayNum(list[i].date) - t0) / 365); return s; };
  var lo = -0.99, hi = 50, flo = npv(lo), fhi = npv(hi);
  if (flo * fhi > 0) return null;
  for (var k = 0; k < 200; k++) { var mid = (lo + hi) / 2, fm = npv(mid); if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; } if (hi - lo < 1e-10) break; }
  return (lo + hi) / 2;
}
/* nav: [[date, totalValue, twrIndex, netFlow, incomePaid], ...] sorted by date. Last row on or before iso, or -1. */
function V8_navAt(nav, iso) {
  var lo = 0, hi = nav.length - 1, ans = -1;
  while (lo <= hi) { var m = (lo + hi) >> 1; if (nav[m][0] <= iso) { ans = m; lo = m + 1; } else hi = m - 1; }
  return ans;
}
/* return over [from, to] (closing values). flows: [[date, amount]] investor view (money in negative).
   twr = chained index; xirr = money-weighted; gain = value change minus net money in plus income paid out. */
function V8_period(nav, flows, from, to) {
  if (!nav || !nav.length) return null;
  var iT = V8_navAt(nav, to || nav[nav.length - 1][0]); if (iT < 0) return null;
  var iF = V8_navAt(nav, from); var fromStart = iF < 0 || iF === 0; if (iF < 0) iF = 0;
  if (iT <= iF) return null;
  var a = nav[iF], b = nav[iT], days = V8_dayNum(b[0]) - V8_dayNum(a[0]), twr = b[2] / a[2] - 1, net = 0, inc = 0, i;
  for (i = fromStart ? 0 : iF + 1; i <= iT; i++) { net += nav[i][3]; inc += nav[i][4]; }
  var startValue = fromStart ? 0 : a[1], gain = b[1] - startValue - net + inc;
  var cfs = []; if (!fromStart) cfs.push({ date: a[0], amount: -a[1] });
  for (i = 0; i < flows.length; i++) { var f = flows[i]; if (f[0] <= b[0] && (fromStart ? f[0] >= a[0] : f[0] > a[0])) cfs.push({ date: f[0], amount: f[1] }); }
  cfs.push({ date: b[0], amount: b[1] });
  var x = V8_xirr(cfs);
  return { from: a[0], to: b[0], days: days, startValue: startValue, endValue: b[1], netIn: net, income: inc, gain: gain, twr: twr,
           twrAnnual: days >= 365 ? Math.pow(1 + twr, 365 / days) - 1 : null, xirr: x, xirrReliable: days >= 365 };
}
/* the standard buttons. years: [1,2,3,5]; the date is today's nav date */
function V8_presets(todayIso, firstIso, years) {
  var y = +todayIso.slice(0, 4), out = [{ id: '1M', label: '1M', from: V8_addDays(todayIso, -30) }, { id: '3M', label: '3M', from: V8_addDays(todayIso, -91) },
    { id: '6M', label: '6M', from: V8_addDays(todayIso, -182) }, { id: 'YTD', label: 'YTD', from: (y - 1) + '-12-31' }];
  (years || []).forEach(function (n) { out.push({ id: n + 'Y', label: n + 'Y', from: (y - n) + todayIso.slice(4) }); });
  out.push({ id: 'ALL', label: 'Since start', from: firstIso });
  return out.filter(function (p) { return p.from >= firstIso || p.id === 'ALL'; });
}
/* value of a deposit plan: v0 now, c a month, r a year (%), n months; deposits at the end of each month */
function V8_fv(v0, c, r, n) { var g = Math.pow(1 + r / 100, 1 / 12); if (n <= 0) return v0; return Math.abs(g - 1) < 1e-12 ? v0 + c * n : v0 * Math.pow(g, n) + c * (Math.pow(g, n) - 1) / (g - 1); }
function V8_requiredMonthly(v0, goal, r, n) { var g = Math.pow(1 + r / 100, 1 / 12); if (n <= 0) return 0; var need = goal - v0 * Math.pow(g, n); if (need <= 0) return 0; return need * (g - 1) / (Math.pow(g, n) - 1); }
function V8_requiredReturn(v0, c, goal, n) { var lo = -50, hi = 300; if (V8_fv(v0, c, hi, n) < goal) return null; for (var i = 0; i < 80; i++) { var m = (lo + hi) / 2; if (V8_fv(v0, c, m, n) >= goal) hi = m; else lo = m; } return hi; }

<script>
/* ---------- app core ---------- */
var $ = function (s, r) { return (r || document).querySelector(s); };
var S = { api: '', key: '', who: null, tab: 'home', stack: [], cache: {}, busy: 0, mem: {} };
var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del: function (k) { try { localStorage.removeItem(k); } catch (e) {} } };

  sheet('<h2>' + esc(r.key || r.limit_id || r.sleeve_id || r.scenario_id || r.asset_id || 'Row ' + rowNo) + '</h2>' + (r.notes && SETTAB === 'config' ? '<p class="mut sm">' + esc(r.notes) + '</p>' : '') + fields.map(function (k) { var ro = locked.test(k); return '<label class="field"><span>' + esc(k) + (ro ? ' (fixed)' : '') + '</span><input id="ef_' + esc(k) + '" value="' + esc(r[k] === null ? '' : r[k]) + '" ' + (ro ? 'disabled' : '') + ' data-old="' + esc(r[k] === null ? '' : r[k]) + '"></label>'; }).join('') + '<div class="btns"><button class="btn" id="eb" onclick="saveRow(' + rowNo + ')">Save</button></div>');
}
function saveRow(rowNo) {
  var inputs = [].slice.call(document.querySelectorAll('#sheet input[id^=ef_]:not([disabled])')).filter(function (i) { return i.value !== i.getAttribute('data-old'); }), b = $('#eb');
  if (!inputs.length) return closeSheet(); busy(b, true);
  (function next(i) { if (i >= inputs.length) { closeSheet(); toast('Saved. Used from the next refresh.'); clearCache(); return SCREENS.settings(); }
    api('settings_set', { tab: SETTAB, row: rowNo, field: inputs[i].id.slice(3), value: inputs[i].value }).then(function () { next(i + 1); }).catch(function (e) { toast(e.message); busy(b, false); }); })(0);
}

/* ---------- Access keys ---------- */
SCREENS.keys = function () {
  setTop('Access keys', 'Keys are never stored in the Sheet', true, '<button class="iconbtn" onclick="newKey()">' + ico('plus') + '</button>');
  api('keys_list').then(function (d) { S.keysData = d; $('#main').innerHTML = '<div class="card" style="padding:4px 16px">' + d.rows.map(function (k) { return '<div class="row tap" onclick="keyDetail(\'' + esc(k.id) + '\')"><div class="avatar">' + esc(String(k.name || '?').slice(0, 2).toUpperCase()) + '</div><div class="grow"><div class="t">' + esc(k.name) + ' <span class="badge ' + (k.status === 'ACTIVE' ? 'OK' : 'ERROR') + '">' + esc(k.role) + (k.status !== 'ACTIVE' ? ' · ' + esc(k.status) : '') + '</span></div><div class="s">' + esc(k.id) + ' · accounts ' + esc(k.accounts || 'ALL') + ' · last used ' + esc(k.lastUsed || 'never') + '</div></div></div>'; }).join('') + '</div><div class="note">A key is shown once when created. Lost one? Revoke it and make a new one. Locked out completely? In the Sheet: Portfolio v8 → Reset admin key.</div>'; }).catch(function (e) { $('#main').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
};
function newKey(id) {
  var k = id ? S.keysData.rows.filter(function (x) { return x.id === id; })[0] : { name: '', role: 'VIEWER', accounts: 'ALL', permissions: '', note: '' };
  sheet('<h2>' + (id ? 'Edit ' + esc(k.name) : 'New access key') + '</h2><label class="field"><span>Name</span><input id="kn" value="' + esc(k.name) + '"></label><label class="field"><span>Role</span><select id="kr">' + ['VIEWER', 'EDITOR', 'ADMIN'].map(function (r) { return '<option' + (k.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select></label><label class="field"><span>Accounts they can see (ALL, or ids separated by commas)</span><input id="ka" value="' + esc(k.accounts || 'ALL') + '"></label><label class="field"><span>Permissions (empty = the role\'s usual set)</span><input id="kp" placeholder="view,trade_entry,review,prices,owner_jobs,settings,keys" value="' + esc(k.permissions || '') + '"></label><div class="btns"><button class="btn" id="kb" onclick="saveKey(\'' + esc(id || '') + '\')">Save</button></div>');
}
function keyDetail(id) { var k = S.keysData.rows.filter(function (x) { return x.id === id; })[0]; sheet('<h2>' + esc(k.name) + '</h2><div class="mut sm">' + esc(k.id) + ' · ' + esc(k.role) + ' · ' + esc(k.status) + '</div><div class="btns"><button class="btn ghost" onclick="newKey(\'' + id + '\')">Edit</button>' + (k.status === 'ACTIVE' ? '<button class="btn danger" onclick="revokeKey(\'' + id + '\')">Revoke</button>' : '') + '</div>'); }
function saveKey(id) { var b = $('#kb'); busy(b, true); api('keys_save', { id: id || undefined, name: $('#kn').value, role: $('#kr').value, accounts: $('#ka').value, permissions: $('#kp').value }).then(function (r) { if (r.key) sheet('<h2>Key created</h2><p class="mut sm">' + esc(r.message) + '</p><div class="card" style="word-break:break-all;font-family:ui-monospace,monospace;font-size:17px;text-align:center" id="kk">' + esc(r.key) + '</div><div class="btns"><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText($(\'#kk\').textContent);toast(\'Copied\')">Copy</button><button class="btn ghost" onclick="closeSheet();SCREENS.keys()">Done</button></div>'); else { closeSheet(); toast(r.message); SCREENS.keys(); } }).catch(function (e) { toast(e.message); busy(b, false); }); }
function revokeKey(id) { api('keys_revoke', { id: id }).then(function (r) { closeSheet(); toast(r.message); SCREENS.keys(); }).catch(function (e) { toast(e.message); }); }

/* ---------- Owner tools and this device ---------- */
SCREENS.tools = function () {
  setTop('Owner tools', '', true);
  $('#main').innerHTML = '<div class="card"><h3>Refresh now</h3><div class="sm mut">Fetch the latest FX and prices, then update the history. Takes up to a minute.</div><div class="btns"><button class="btn" onclick="runJob(this,\'refresh\',\'Refreshed\')">Refresh now</button></div></div><div class="card"><h3>Rebuild history</h3><div class="sm mut">Recalculate every day from the first transaction. Use after a correction in the past. Takes a few minutes.</div><div class="btns"><button class="btn ghost" onclick="if(confirm(\'Rebuild the whole history?\'))runJob(this,\'rebuild\',\'History rebuilt\')">Rebuild history</button></div></div>';
};
SCREENS.account = function () {
  setTop('This device', '', true);
  var bio = !!LS.get('pv8bio'), th = LS.get('pv8theme') || 'auto';
  $('#main').innerHTML = '<div class="card"><h3>Signed in</h3>' + kv('Name', esc(S.who.name)) + kv('Role', esc(S.who.role)) + kv('Accounts', S.who.scope === 'ALL' ? 'All' : esc(S.who.scope.join(', '))) + '</div>'
    + '<div class="card"><h3>Unlock</h3><div class="sm mut">' + (bioSupported() ? 'Use Face ID, Touch ID or your fingerprint to open the app. Typing the key always still works.' : 'This device or browser does not offer biometric unlock.') + '</div><div class="btns">' + (bioSupported() ? (bio ? '<button class="btn danger" onclick="bioOff()">Turn off biometric unlock</button>' : '<button class="btn" onclick="bioOn()">Turn on biometric unlock</button>') : '') + '' + (S.who.keyEdit ? '<button class="btn ghost" onclick="changeKey()">Change my key</button>' : '') + '</div></div>'
    + '<div class="card"><h3>Look</h3><div class="seg">' + ['auto', 'dark', 'light'].map(function (t) { return '<button class="' + (th === t ? 'on' : '') + '" onclick="setTheme(\'' + t + '\')">' + t[0].toUpperCase() + t.slice(1) + '</button>'; }).join('') + '</div></div>'
    + '<div class="card"><div class="btns"><button class="btn danger" onclick="signOut()">Sign out of this device</button></div><div class="note">Signing out removes the key from this device.</div></div>';
};
function setTheme(t) { LS.set('pv8theme', t); applyTheme(); SCREENS.account(); }
function applyTheme() { var t = LS.get('pv8theme') || 'auto'; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
function changeKey() { sheet('<h2>Change my key</h2><p class="mut sm">A new key is made and shown once. The old one stops working at once.</p><label class="field"><span>Type your current key</span><input id="ck" type="password" autocomplete="off"></label><div class="btns"><button class="btn" id="cb" onclick="doChangeKey()">Make a new key</button></div>'); }
function doChangeKey() { var b = $('#cb'); busy(b, true); api('change_own_key', { current: $('#ck').value }).then(function (r) { S.key = r.key; LS.set('pv8key', r.key); sheet('<h2>New key</h2><p class="mut sm">' + esc(r.message) + ' Copy it now.</p><div class="card" id="nk" style="word-break:break-all;font-family:ui-monospace,monospace;font-size:17px;text-align:center">' + esc(r.key) + '</div><div class="btns"><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText($(\'#nk\').textContent);toast(\'Copied\')">Copy</button><button class="btn ghost" onclick="closeSheet()">Done</button></div>'); }).catch(function (e) { toast(e.message); busy(b, false); }); }

/* ---------- biometric unlock (the device proves it is you; the key stays on the device) ---------- */
function bioSupported() { return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
function unb64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a.buffer; }
function rnd(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
function bioOn() {
  navigator.credentials.create({ publicKey: { challenge: rnd(32), rp: { name: 'Portfolio' }, user: { id: rnd(16), name: 'portfolio-owner', displayName: S.who ? S.who.name : 'Owner' }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000 } })
    .then(function (c) { LS.set('pv8bio', b64(c.rawId)); toast('Biometric unlock is on'); SCREENS.account(); }).catch(function () { toast('Could not turn it on'); });
}
function bioOff() { LS.del('pv8bio'); toast('Biometric unlock is off'); SCREENS.account(); }
function bioUnlock() {
  var id = LS.get('pv8bio'); if (!id) return Promise.reject();
  return navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: unb64(id), transports: ['internal'] }], userVerification: 'required', timeout: 60000 } });
}

/* ---------- option events ---------- */
function optEvent(ev, id) {
  var o = id ? ((S.mem.options || { open: [] }).open.filter(function (x) { return x.id === id; })[0]) : null, today = (S.ov && S.ov.asOf) || new Date().toISOString().slice(0, 10);
  today = new Date().toISOString().slice(0, 10);
  var title = { BTC: 'Bought back', EXPIRE: 'Expired', ASSIGN: 'Assigned', STO: 'Sell a new option' }[ev];
  if (ev === 'STO') { return Promise.all([api('accounts'), api('assets')]).then(function (r) { sheet('<h2>' + title + '</h2><label class="field"><span>Account</span><select id="oa">' + r[0].map(function (a) { return '<option value="' + esc(a.id) + '">' + esc(a.broker + ' · ' + a.id) + '</option>'; }).join('') + '</select></label><label class="field"><span>Asset</span><input id="os" autocapitalize="characters"></label><div class="seg"><button id="op" class="on" onclick="$(\'#op\').className=\'on\';$(\'#oc\').className=\'\';S.optType=\'PUT\'">Put</button><button id="oc" onclick="$(\'#oc\').className=\'on\';$(\'#op\').className=\'\';S.optType=\'CALL\'">Call</button></div><div class="grid2"><label class="field"><span>Date</span><input type="date" id="od" value="' + today + '"></label><label class="field"><span>Expiry</span><input type="date" id="oe"></label><label class="field"><span>Strike</span><input type="number" step="any" id="ok"></label><label class="field"><span>Contracts</span><input type="number" id="on" value="1"></label><label class="field"><span>Premium per share</span><input type="number" step="any" id="opr"></label><label class="field"><span>Commission</span><input type="number" step="any" id="of"></label></div><div class="btns"><button class="btn" id="ob" onclick="saveOpt(\'STO\',\'\')">Save</button></div>'); S.optType = 'PUT'; }); }
  sheet('<h2>' + title + ' · ' + esc(o ? o.asset + ' ' + o.type + ' ' + o.strike : id) + '</h2><p class="mut sm">' + esc(id) + ' · ' + (o ? o.contracts + ' contract(s), expires ' + dshort(o.expiry) : '') + '</p><label class="field"><span>Date</span><input type="date" id="od" value="' + today + '"></label>' + (ev === 'BTC' ? '<div class="grid2"><label class="field"><span>Price per share</span><input type="number" step="any" inputmode="decimal" id="opr" oninput="optGross(' + (o ? o.contracts * o.multiplier : 100) + ')"></label><label class="field"><span>Commission</span><input type="number" step="any" inputmode="decimal" id="of"></label></div><div class="mut sm" id="og"></div>' : '<label class="field"><span>Commission (if any)</span><input type="number" step="any" id="of"></label>') + '<div class="btns"><button class="btn" id="ob" onclick="saveOpt(\'' + ev + '\',\'' + esc(id) + '\')">Save</button></div>');
}
function optGross(mult) { var p = +$('#opr').value; $('#og').textContent = p >= 0 && $('#opr').value !== '' ? 'Paid to close ' + num(p * mult, 2) : ''; }
function saveOpt(ev, id) {
  var b = $('#ob'), p = { event: ev, option_id: id || undefined, date: $('#od').value, fees: $('#of') ? $('#of').value : 0 };
  if (ev === 'BTC') p.price = $('#opr').value;
  if (ev === 'STO') { p.acct = $('#oa').value; p.asset = $('#os').value.trim().toUpperCase(); p.type = S.optType; p.strike = $('#ok').value; p.expiry = $('#oe').value; p.contracts = $('#on').value; p.price = $('#opr').value; }
  busy(b, true); api('option_event', p).then(function (r) { closeSheet(); toast(r.message); clearCache(); push('options'); }).catch(function (e) { toast(e.message); busy(b, false); });
}

/* ---------- sign in, lock and start ---------- */
var LOGO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>';
function lockScreen(html) { var l = $('#lock'); l.innerHTML = '<div class="logo">' + LOGO + '</div>' + html; l.classList.remove('hide'); }
function unlockScreen() { $('#lock').classList.add('hide'); $('#lock').innerHTML = ''; }
function showSetup() {
  lockScreen('<h1>Portfolio</h1><p>Paste the web app address from your Apps Script deployment. You only do this once on each device.</p><div class="box"><label class="field"><span>Web app URL</span><input id="su" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off"></label><div class="err" id="se"></div><button class="btn" style="width:100%" onclick="saveSetup()">Continue</button></div>');
}
function saveSetup() { var u = $('#su').value.trim(); if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u) && !/^https:\/\/.+/.test(u)) { $('#se').textContent = 'That does not look like a web app address.'; return; } LS.set('pv8api', u); S.api = u; boot(); }
function showKey(msg) {
  var bio = !!LS.get('pv8bio') && !!LS.get('pv8key');
  lockScreen('<h1>Welcome back</h1><p>' + (bio ? 'Use biometrics, or type your access key.' : 'Type your access key.') + '</p><div class="box">' + (bio ? '<button class="btn" style="width:100%;margin-bottom:12px" onclick="tryBio()">Unlock with biometrics</button>' : '') + '<label class="field"><span>Access key</span><input id="ki" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" onkeydown="if(event.key===\'Enter\')submitKey()"></label><div class="err" id="ke">' + esc(msg || '') + '</div><button class="btn ' + (bio ? 'ghost' : '') + '" style="width:100%" id="kbtn" onclick="submitKey()">Sign in</button><div class="tiny" style="margin-top:16px"><a href="#" onclick="LS.del(\'pv8api\');S.api=\'\';boot();return false" style="color:var(--tx3)">Change the web app address</a></div></div>');
  if (!bio) setTimeout(function () { var i = $('#ki'); i && i.focus(); }, 100);
}
function submitKey() {
  var k = $('#ki').value.trim(); if (!k) return; var b = $('#kbtn'); busy(b, true); S.key = k;
  api('login').then(function (w) { LS.set('pv8key', k); S.who = { name: w.name, role: w.role, perms: w.perms, scope: w.scope, keyEdit: w.keyEdit }; unlockScreen(); start(true); }).catch(function (e) { S.key = ''; busy(b, false); $('#ke').textContent = e.code === 'LOCKED' ? e.message : (e.message === 'Failed to fetch' ? 'Cannot reach the app. Check the connection and the address.' : e.message); });
}
function tryBio() { bioUnlock().then(function () { S.key = LS.get('pv8key'); return api('login'); }).then(function (w) { S.who = { name: w.name, role: w.role, perms: w.perms, scope: w.scope, keyEdit: w.keyEdit }; unlockScreen(); start(false); }).catch(function (e) { if (e && e.message) showKey(e.message); }); }
function signOut(silent) { LS.del('pv8key'); LS.del('pv8bio'); clearCache(); S.key = ''; S.who = null; showKey(silent ? 'Signed out. Please sign in again.' : ''); }
function start(first) {
  S.last = Date.now(); drawTabs(); go('home');
  if (first && bioSupported() && !LS.get('pv8bio') && !LS.get('pv8bioask')) { LS.set('pv8bioask', '1'); setTimeout(function () { sheet('<h2>Open with Face ID or fingerprint?</h2><p class="mut sm">Your device confirms it is you, so you do not have to type the key. Typing it still works any time.</p><div class="btns"><button class="btn" onclick="closeSheet();bioOn()">Turn it on</button><button class="btn ghost" onclick="closeSheet()">Not now</button></div>'); }, 1500); }
}
function boot() {
  applyTheme(); S.api = LS.get('pv8api') || (new URLSearchParams(location.search).get('api')) || '';
  if (new URLSearchParams(location.search).get('api')) { LS.set('pv8api', S.api); history.replaceState(null, '', location.pathname); }
  if (!S.api) return showSetup();
  S.key = LS.get('pv8key') || ''; if (!S.key) return showKey();
  if (LS.get('pv8bio')) { showKey(); return tryBio(); }
  api('login').then(function (w) { S.who = { name: w.name, role: w.role, perms: w.perms, scope: w.scope, keyEdit: w.keyEdit }; unlockScreen(); start(false); }).catch(function (e) { if (e.code === 'DENIED' || e.code === 'LOCKED') showKey(e.message); else { var c = cacheGet('overview'); if (c) { S.who = { name: 'Offline', role: 'VIEWER', perms: ['view'], scope: 'ALL' }; unlockScreen(); start(false); toast('Offline: showing saved data'); } else showKey('Cannot reach the app.'); } });
}
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { S.hiddenAt = Date.now(); return; }
  if (S.hiddenAt && Date.now() - S.hiddenAt > 5 * 60000 && LS.get('pv8bio') && S.who) { showKey(); tryBio(); }
  else if (S.hiddenAt && Date.now() - S.hiddenAt > 2 * 60000 && S.who && S.tab === 'home') { go('home'); }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
window.addEventListener('DOMContentLoaded', boot);

</script>
