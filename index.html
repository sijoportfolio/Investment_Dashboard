.usd2{font-size:13px;color:var(--tx3);font-weight:500;margin-top:1px}
.btn,.chip,.iconbtn,.seg button,#tabs button,.tap{transition:transform .08s ease,opacity .12s,background .15s}

<script>

function V8_dayNum(iso) { var p = String(iso).slice(0, 10).split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function V8_isoDay(n) { var d = new Date(n * 86400000); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
function V8_addDays(iso, n) { return V8_isoDay(V8_dayNum(iso) + n); }
/* money-weighted return. cfs: [{date, amount}] with money you put in negative. Returns a fraction a year, or null. */
function V8_xirr(cfs) {
  if (!cfs.length) return null;
  var list = cfs.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }), t0 = V8_dayNum(list[0].date);
  var npv = function (r) { var s = 0; for (var i = 0; i < list.length; i++) s += list[i].amount / Math.pow(1 + r, (V8_dayNum(list[i].date) - t0) / 365); return s; };
  var lo = -0.99, hi = 50, flo = npv(lo), fhi = npv(hi);
  if (flo * fhi > 0) return null;
  for (var k = 0; k < 200; k++) { var mid = (lo + hi) / 2, fm = npv(mid); if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; } if (hi - lo < 1e-10) break; }
  return (lo + hi) / 2;
}
/* nav: [[date, totalValue, twrIndex, netFlow, incomePaid], ...] sorted by date. Last row on or before iso, or -1. */

function monthsFrom(startIso, n) { var y = +startIso.slice(0, 4), m = +startIso.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + ('0' + (m + 1)).slice(-2) + '-' + startIso.slice(8, 10); }

function simPlan(f, monthly, rate, mode, stepPct, nMonths) {

function aeAccSel(id, sel, change) { return '<select id="' + id + '" onchange="' + (change || 'aeEffect()') + '">' + AE.meta.accounts.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === sel ? ' selected' : '') + '>' + esc(a.broker + ' · ' + a.id + ' (' + a.ccy + ')') + '</option>'; }).join('') + '</select>'; }
function aeDefaultAcct() {
  if (AE.pre.acct) return AE.pre.acct;
  var ib = AE.meta.accounts.filter(function (a) { return /IBKR/i.test(a.id + a.broker); })[0]; return (ib || AE.meta.accounts[0] || {}).id;
}
function aeSleeveSel(acctId) {
  var def = (aeAcc(acctId) || {}).sleeve || 'OWNER';
  return '<label class="field"><span>For (whose money this is)</span><select id="aes">' + AE.meta.sleeves.map(function (s) { return '<option' + (s === def ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></label>';
}
function aeDraw() {
  var t = AE.type, pre = AE.pre, today = new Date().toISOString().slice(0, 10), acct = aeDefaultAcct(), f = function (id, lab, attrs) { return '<label class="field"><span>' + lab + '</span><input id="' + id + '" ' + (attrs || '') + '></label>'; };
  var chips = '<div class="chips" style="flex-wrap:wrap">' + AE_TYPES.map(function (x) { return '<button class="chip ' + (t === x[0] ? 'on' : '') + '" onclick="aeType(\'' + x[0] + '\')">' + x[1] + '</button>'; }).join('') + '</div>';
  var body = '';
  if (t === 'BUY' || t === 'SELL' || t === 'OPTION') {
    sheet('<h2>Add entry</h2>' + chips + '<p class="mut sm">Opening the ' + (t === 'OPTION' ? 'option' : 'trade') + ' form…</p>');
    setTimeout(function () { if (t === 'OPTION') optEvent('STO', '', pre); else addTx(pre); }, 50); return;
  }
  if (t === 'TRANSFER') {
    var to = (AE.meta.accounts.filter(function (a) { return a.id !== acct; })[0] || {}).id;
    body = '<label class="field"><span>From account</span>' + aeAccSel('aef', pre.from || (/WIO/i.test(acct) ? acct : (AE.meta.accounts.filter(function (a) { return /WIO/i.test(a.id); })[0] || {}).id || acct)) + '</label><label class="field"><span>To account</span>' + aeAccSel('aet', pre.to || acct) + '</label>'
      + '<div class="grid2">' + f('aea', 'Amount sent', 'type="number" step="any" inputmode="decimal" oninput="aeEffect()"') + '<div id="aeinw">' + f('aei', 'Amount received', 'type="number" step="any" inputmode="decimal" oninput="aeEffect()"') + '</div>' + f('aed', 'Date it left', 'type="date" value="' + today + '"') + f('aedi', 'Date it arrived (if later)', 'type="date"') + f('aefee', 'Fee (optional)', 'type="number" step="any" inputmode="decimal"') + '</div>'
      + '<div class="tiny">Between two cash-keeping accounts this is saved as a withdrawal plus a deposit, linked together, and does not count as new money in. A direct account (Wio) keeps no cash, so only the other side is recorded.</div>';
  } else {
    body = '<label class="field"><span>Account</span>' + aeAccSel('aeac', acct, 'aeAcctChange()') + '</label>';
    if (t === 'DIVIDEND') body += '<label class="field"><span>Stock</span><select id="aeas">' + AE.meta.assets.filter(function (a) { return a.held; }).map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === pre.asset ? ' selected' : '') + '>' + esc(a.id + ' · ' + a.name) + '</option>'; }).join('') + '</select></label>';
    body += '<div class="grid2">' + f('aea', t === 'DIVIDEND' ? 'Gross amount' : 'Amount', 'type="number" step="any" inputmode="decimal" oninput="aeEffect()"') + f('aed', 'Date', 'type="date" value="' + today + '"');
    if (t === 'DIVIDEND') body += f('aetax', 'Tax withheld', 'type="number" step="any" inputmode="decimal"') + f('aeq', 'Shares (optional)', 'type="number" step="any" inputmode="decimal"');
    if (t === 'DEPOSIT' || t === 'WITHDRAWAL') body += f('aefee', 'Fee (optional)', 'type="number" step="any" inputmode="decimal"');
    body += '</div>' + aeSleeveSel(acct);
  }
  body += f('aen', 'Note (optional)', 'maxlength="200"') + '<div class="tiny" id="aeeff" style="margin:4px 0 8px"></div><div class="err" id="aeerr"></div>'
    + '<div class="btns"><button class="btn" id="aeb" onclick="aeSave(false)">Save</button><button class="btn ghost" onclick="aeSave(true)">Save and add another</button></div>';
  sheet('<h2>Add entry</h2>' + chips + body);
  if (t === 'TRANSFER') aeXfer();
  if (t === 'TRANSFER') { $('#aef').onchange = aeXfer; $('#aet').onchange = aeXfer; }
}
function aeAcctChange() { var s = $('#aes'); if (s) { var a = aeAcc($('#aeac').value); if (a) s.value = a.sleeve || 'OWNER'; } aeEffect(); }
function aeXfer() {
  var f = aeAcc($('#aef').value), t = aeAcc($('#aet').value), same = f && t && f.ccy === t.ccy;
  $('#aeinw').style.display = same ? 'none' : '';
  $('#aei').previousElementSibling.textContent = 'Amount received (' + (t ? t.ccy : '') + ')'; $('#aea').previousElementSibling.textContent = 'Amount sent (' + (f ? f.ccy : '') + ')';
  aeEffect();
}
function aeEffect() {
  var t = AE.type, el = $('#aeeff'); if (!el) return; var a = +($('#aea') || {}).value || 0, s = '';
  if (t === 'TRANSFER') {
    var f = aeAcc($('#aef').value), to = aeAcc($('#aet').value), inn = f && to && f.ccy === to.ccy ? a : (+($('#aei') || {}).value || 0);
    if (f && to && f.direct && to.direct) s = 'Both are direct accounts (no cash kept): nothing can be recorded.';
    else if (f && f.direct) s = 'Wio-type accounts keep no cash, so this is saved as ONE deposit of ' + num(inn || a, 2) + ' ' + to.ccy + ' on ' + to.id;
    else if (to && to.direct) s = 'Saved as ONE withdrawal of ' + num(a, 2) + ' ' + f.ccy + ' on ' + f.id + ' (' + to.id + ' keeps no cash)';
    else if (a) s = f.id + ' cash −' + num(a, 2) + ' ' + f.ccy + '  ·  ' + to.id + ' cash +' + num(inn, 2) + ' ' + to.ccy;
  } else {
    var ac = aeAcc($('#aeac') && $('#aeac').value), sign = (t === 'WITHDRAWAL' || t === 'FEE') ? '−' : '+';
    if (ac && ac.direct && (t === 'DEPOSIT' || t === 'WITHDRAWAL' || t === 'FEE')) s = ac.id + ' is a direct account: no cash is kept there, so this is not recorded. Money in and out comes from each buy and sell. To fund IBKR from the bank, add a Deposit on IBKR-01.';
    else if (a && ac) s = ac.id + ' cash ' + sign + num(a, 2) + ' ' + ac.ccy;
  }
  el.textContent = s ? (/direct|Both|keeps no cash|ONE/.test(s) ? s : 'Effect: ' + s) : '';
}
function aeSave(again) {
  var t = AE.type, p = { type: t, date: $('#aed').value, note: $('#aen').value }, b = $('#aeb'); $('#aeerr').textContent = '';
  if (t === 'TRANSFER') { p.from = $('#aef').value; p.to = $('#aet').value; p.amountOut = $('#aea').value; p.amountIn = $('#aeinw').style.display === 'none' ? '' : $('#aei').value; p.dateIn = $('#aedi').value; p.fees = $('#aefee').value; }
  else { p.account_id = $('#aeac').value; p.amount = $('#aea').value; p.sleeve = $('#aes').value; if (t === 'DIVIDEND') { p.asset_id = $('#aeas').value; p.tax = $('#aetax').value; p.quantity = $('#aeq').value; } if ($('#aefee')) p.fees = $('#aefee').value; }
  var run = function (confirmDup) { if (confirmDup) p.confirmDup = true; busy(b, true); api('entry_create', p).then(function (r) { toast(r.message); clearCache(); AE.meta = null; if (again) { addEntry({ type: t, acct: p.account_id, from: p.from, to: p.to }); } else { closeSheet(); S.force = true; if (S.stack.length && S.stack[S.stack.length - 1].name === 'cash') SCREENS.cash(); else if (S.tab === 'home' || S.tab === 'holdings') go2(S.tab); } }).catch(function (e) { busy(b, false); if (/Possible duplicate/.test(e.message)) { if (confirm(e.message)) run(true); } else $('#aeerr').textContent = e.message; }); };
  run(false);
}
function go2(tab) { go(tab); }


/* ---------- Home graph: compare with market indexes, and show only some accounts ---------- */
var BC = ['#5aa9ff', '#ffb454', '#c792ea', '#ff7aa8'];
HOME.cmp = (function () { try { return JSON.parse(LS.get('pv8cmp') || '[]'); } catch (e) { return []; } })();
HOME.accts = (function () { try { var v = JSON.parse(LS.get('pv8accts') || 'null'); return v && v.length ? v : null; } catch (e) { return null; } })();
S.bench = null; S.benchCat = null; S.navacct = null; S.benchTried = {}; S.navTried = false;
function hSave() { try { LS.set('pv8cmp', JSON.stringify(HOME.cmp)); LS.set('pv8accts', JSON.stringify(HOME.accts)); } catch (e) {} }
function hLoadBench(done) {
  if (!isAll()) return;
  var need = HOME.cmp.filter(function (s) { return !(S.bench && S.bench.series && S.bench.series[s]) && !S.benchTried[s]; });
  if (need.length || !S.benchCat) api('bench', { symbols: HOME.cmp }).then(function (b) { HOME.cmp.forEach(function (s) { S.benchTried[s] = true; }); S.benchCat = b.catalog; S.bench = { series: Object.assign({}, S.bench ? S.bench.series : {}, b.series), updated: b.updated }; if (done) done(); }).catch(function (e) { toast(e.message); });
  else if (done) done();
}
function hLoadNav(done) { if (S.navacct || S.navTried) return done && done(); S.navTried = true; api('navacct').then(function (n) { S.navacct = n; if (done) done(); }).catch(function (e) { toast(e.message); }); }
function homeCmpBar() {
  var n = HOME.cmp.length, fa = HOME.accts ? HOME.accts.length : 0;
  return '<div class="chips" style="margin:0 0 8px"><button class="chip ' + (n ? 'on' : '') + '" onclick="cmpSheet()">⇄ Compare' + (n ? ' · ' + n : '') + '</button><button class="chip ' + (fa ? 'on' : '') + '" onclick="acctSheet()">Accounts' + (fa ? ' · ' + fa : '') + '</button>' + ((n || fa) ? '<button class="chip" onclick="HOME.cmp=[];HOME.accts=null;hSave();drawHome(S.ov)">Clear</button>' : '') + '</div>';
}
/* the return line of the selected accounts, from their daily values and the money moved in and out of them (approximate; the all-accounts line uses your exact time-weighted figures) */
function acctIndex(o) {
  var n = S.navacct, sel = {}; HOME.accts.forEach(function (a) { sel[a] = 1; });
  var fl = {}; (o.flows || []).forEach(function (f) { if (f[3] && sel[f[3]]) fl[f[0]] = (fl[f[0]] || 0) - f[1]; });
  var idx = 1, out = [], prev = null;
  n.dates.forEach(function (d, i) {
    var v = 0; HOME.accts.forEach(function (a) { if (n.values[a]) v += n.values[a][i] || 0; });
    if (prev !== null && prev > 0) idx *= (v - (fl[d] || 0)) / prev; prev = v; out.push([d, idx]);
  });
  return out;
}
function homeReturn(o, sub, from) {
  var port, label = 'Return since ' + dshort(from) + ' (time-weighted, deposits removed)';
  if (HOME.accts && S.navacct) { var ai = acctIndex(o).filter(function (r) { return r[0] >= from; }); var a0 = ai.length ? ai[0][1] : 1; port = ai.map(function (r) { return [r[0], (r[1] / a0 - 1) * 100]; }); label = 'Selected accounts (' + HOME.accts.join(', ') + ')'; }
  else { var b0 = sub.length ? sub[0][2] : 1; port = sub.map(function (r) { return [r[0], (r[2] / b0 - 1) * 100]; }); }
  if (!port.length) port = sub.map(function (r) { return [r[0], 0]; });
  var lines = [{ pts: port, color: 'var(--acc)', fill: !HOME.cmp.length }], leg = ['<span><i style="background:var(--acc)"></i>' + (HOME.accts ? 'Your accounts' : 'You') + '</span>'], rows = [[HOME.accts ? 'Your accounts' : 'You', port.length ? port[port.length - 1][1] : null, null]], last = port.length ? port[port.length - 1][0] : from;
  HOME.cmp.forEach(function (sym, k) {
    var s = S.bench && S.bench.series[sym]; if (!s) return; var pts = s.filter(function (r) { return r[0] >= from && r[0] <= last; }); if (pts.length < 2) return;
    var base = pts[0][1], name = ((S.benchCat || []).filter(function (c) { return c.sym === sym; })[0] || { name: sym }).name, col = BC[k % BC.length];
    lines.push({ pts: pts.map(function (r) { return [r[0], (r[1] / base - 1) * 100]; }), color: col, w: 1.6 }); leg.push('<span><i style="background:' + col + '"></i>' + esc(name) + '</span>');
    rows.push([name, (pts[pts.length - 1][1] / base - 1) * 100, col]);
  });
  var h = lineChart('c1', lines, { fmt: function (v) { return pc(v, 1); } }) + '<div class="legend">' + leg.join('') + '</div>';
  if (rows.length > 1) { var me = rows[0][1]; h += '<div style="margin-top:8px">' + rows.map(function (r, i) { return '<div class="kv"><span>' + (r[2] ? '<i style="display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:' + r[2] + '"></i>' : '') + esc(r[0]) + '</span><span class="num ' + cls(r[1]) + '">' + arw(r[1]) + pc(r[1], 1) + (i && me !== null && r[1] !== null ? ' <span class="tiny">you ' + (me - r[1] >= 0 ? 'ahead by ' : 'behind by ') + pcp(Math.abs(me - r[1])) + '</span>' : '') + '</span></div>'; }).join('') + '</div><div class="tiny" style="margin-top:6px">Index lines are each index\'s own price (rupee and dirham indexes in their own currency), from ' + dshort(from) + '. Updated ' + dshort((S.bench || {}).updated) + '.</div>'; }
  else if (!HOME.accts) h = h.replace('</div>', '</div>');
  return h + (HOME.accts ? '<div class="tiny">' + esc(label) + '. Worked out from each account\'s daily value and its deposits and withdrawals, so small differences from the exact figure are normal.</div>' : '');
}
function cmpSheet() {
  hLoadBench(function () {
    var groups = {}; (S.benchCat || []).forEach(function (c) { (groups[c.group] = groups[c.group] || []).push(c); });
    sheet('<h2>Compare with</h2><p class="mut sm">Tick up to four. Lines start at 0% at the beginning of the period you chose.</p>' + Object.keys(groups).map(function (g) { return '<div class="tiny" style="font-weight:700;margin:10px 0 2px;text-transform:uppercase;letter-spacing:.05em">' + esc(g) + '</div>' + groups[g].map(function (c) { return '<label style="display:flex;gap:12px;align-items:center;padding:7px 0;font-size:16px;' + (c.missing ? 'opacity:.45' : '') + '"><input type="checkbox" class="cmpk" style="width:22px;height:22px;flex:none;margin:0" value="' + esc(c.sym) + '"' + (HOME.cmp.indexOf(c.sym) >= 0 ? ' checked' : '') + (c.missing ? ' disabled' : '') + ' onchange="cmpLimit(this)"><span>' + esc(c.name) + (c.missing ? ' <span class="tiny">(no data yet)</span>' : '') + '</span></label>'; }).join(''); }).join('') + '<div class="btns"><button class="btn" onclick="cmpApply()">Show on the graph</button></div>');
  });
}
function cmpLimit(el) { var n = document.querySelectorAll('.cmpk:checked').length; if (n > 4) { el.checked = false; toast('Up to four at a time keeps the graph readable.'); } }
function cmpApply() {
  HOME.cmp = [].filter.call(document.querySelectorAll('.cmpk'), function (c) { return c.checked; }).map(function (c) { return c.value; }); hSave(); closeSheet();
  if (HOME.cmp.length) HOME.view = 'return';
  hLoadBench(function () { drawHome(S.ov); });
}
function acctSheet() {
  hLoadNav(function () {
    var ac = S.navacct.accounts, regions = {}; ac.forEach(function (a) { if (a.region) (regions[a.region] = regions[a.region] || []).push(a.acct); });
    sheet('<h2>Which accounts</h2><p class="mut sm">Your line on the graph covers only the accounts you tick. Leave all ticked for the whole portfolio.</p><div class="chips" style="flex-wrap:wrap">' + Object.keys(regions).map(function (r) { return '<button class="chip" onclick="acctQuick(\'' + esc(r) + '\')">' + esc(r) + ' only</button>'; }).join('') + '<button class="chip" onclick="acctQuick(\'\')">All</button></div>' + ac.map(function (a) { return '<label style="display:flex;gap:12px;align-items:center;padding:7px 0;font-size:16px"><input type="checkbox" class="acck" data-r="' + esc(a.region) + '" style="width:22px;height:22px;flex:none;margin:0" value="' + esc(a.acct) + '"' + (!HOME.accts || HOME.accts.indexOf(a.acct) >= 0 ? ' checked' : '') + '><span>' + esc(a.broker) + ' · ' + esc(a.acct) + ' <span class="tiny">' + esc(a.region) + '</span></span></label>'; }).join('') + '<div class="btns"><button class="btn" onclick="acctApply()">Show on the graph</button></div>');
  });
}
function acctQuick(r) { [].forEach.call(document.querySelectorAll('.acck'), function (c) { c.checked = !r || c.getAttribute('data-r') === r; }); }
function acctApply() {
  var on = [].filter.call(document.querySelectorAll('.acck'), function (c) { return c.checked; }).map(function (c) { return c.value; }), all = document.querySelectorAll('.acck').length;
  if (!on.length) { toast('Tick at least one account.'); return; }
  HOME.accts = on.length === all ? null : on; hSave(); closeSheet(); if (HOME.accts) HOME.view = 'return'; drawHome(S.ov);
}

</script>
